name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master, develop ]
    types: [opened, synchronize, reopened]

jobs:
  # Job 1: Unit Tests and Coverage
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    environment: Test env
    
    steps:
    - name: 📝 CI Pipeline Info
      run: |
        echo "🔧 Running CI Pipeline - Unit Tests & Coverage"
        echo "📂 Event: ${{ github.event_name }}"
        echo "🌿 Branch: ${{ github.ref_name }}"
        echo "🎯 Full Ref: ${{ github.ref }}"
        echo "� Commit SHA: ${{ github.sha }}"
        echo "📂 Repository: ${{ github.repository }}"
        echo "�💻 Runner: ${{ runner.os }}"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "🔀 PR #${{ github.event.number }}: ${{ github.event.pull_request.title }}"
          echo "👤 Author: ${{ github.event.pull_request.user.login }}"
          echo "🎯 Source Branch: ${{ github.event.pull_request.head.ref }}"
          echo "🎯 Target Branch: ${{ github.event.pull_request.base.ref }}"
          echo "📝 Source SHA: ${{ github.event.pull_request.head.sha }}"
        else
          echo "🚀 Push to branch: ${{ github.ref_name }}"
        fi
        
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run unit tests with coverage
      run: npm run test:ci
      env:
        CI: true
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false
        
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

  # Job 2: Build Validation
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: unit-tests
    environment: Test env
    
    steps:
    - name: 📝 Build Info
      run: |
        echo "🏗️ Running Build Validation"
        echo "🌿 Branch: ${{ github.ref_name }}"
        echo "📂 Event: ${{ github.event_name }}"
        
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000/api/
        AUTH_SECRET: ${{ env.AUTH_SECRET || 'default-value' }}

  # Job 3: Linting and Code Quality
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: 📝 Lint Info
      run: |
        echo "🔍 Running Lint & Code Quality Checks"
        echo "🌿 Branch: ${{ github.ref_name }}"
        echo "📂 Event: ${{ github.event_name }}"
        
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Check TypeScript
      run: npx tsc --noEmit
